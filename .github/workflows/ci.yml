name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check gofmt Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check Shell Script Syntax
        run: bash -n scripts/*.sh

      - name: Byte-compile Python Scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check Node.js Entry Points
        run: |
          node --check npm/bin/litespm.js
          node --check npm/scripts/install-binary.js

      # The installer is the only place this project executes a downloaded
      # native binary, so its refusal paths are tested rather than assumed.
      # test_npm.js needs a binary to resolve, so one is built first and dropped
      # in dist/ under the name the wrapper looks for.
      - name: Test npm Wrapper and Installer
        run: |
          go build -o "dist/$(node -p "require('./npm/bin/litespm.js').getBinaryName()")" ./cmd/litespm
          cd npm && npm test

      # The committed dataset is the input to every published release. Nothing
      # else in CI touched it, so an edit that made the dataset un-compilable
      # (duplicate or unsafe listing ids) or that drifted from the released tree
      # would only surface at deploy time, on the machine doing the deploying.
      # --materialize reproduces the released pointer byte for byte from the
      # committed dataset, so this is a reproducibility check, not a network one.
      - name: Verify Dataset Reproduces the Released Tree
        run: |
          go run ./cmd/litespm catalog build \
            --materialize \
            --out "${{ runner.temp }}/release-check" \
            --prev web/public/v1/current.json
          go run ./cmd/litespm catalog build --verify "${{ runner.temp }}/release-check"

      # web/lib/hosts.ts and the two JSON registries it imports are emitted
      # from the compiled-in Go host adapters (scripts/gen_hosts_ts.go). An
      # adapter edit that is not regenerated shows up as a stale compatibility
      # matrix on the public site and as snippets that disagree with what the
      # binary actually writes, so the generator is re-run here and the tree
      # must come back byte-identical.
      - name: Verify Generated Host Data Is Current
        run: |
          go run scripts/gen_hosts_ts.go
          git diff --exit-code -- web/data/hosts.json web/data/skill-targets.json web/lib/hosts.ts

  test-go:
    name: Test Go Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go Test Suite
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Go Test Suite (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

  build-web:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign's keyless flow mints a Fulcio certificate from this workflow's
      # OIDC token, which requires id-token: write. Without it the deploy
      # script skips signing (and says so).
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # scripts/deploy-pages.sh materializes the release tree with the Go
      # builder, so packaging it here requires the Go toolchain too.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # deploy-pages.sh signs /v1/current.json when a signing identity exists;
      # the OIDC token is that identity (cosign keyless). Fork PRs receive no
      # token, and the script's skip branch covers them.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Type-check Web
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Build Web Static Export
        working-directory: ./web
        run: npm run build

      - name: Verify Static Output
        run: test -f web/out/index.html

      # Package the bundle exactly as scripts/deploy-pages.sh does — export,
      # drop the copied /v1, materialize the released tree — and then judge it
      # with the same audit script the deploy runs. This is what catches a source
      # map in the export or a release tree that no longer matches its pointer,
      # before either reaches the CDN.
      - name: Package and Audit the Deploy Bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy-pages.sh
