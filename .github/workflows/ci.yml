name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check gofmt Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check Shell Script Syntax
        run: bash -n scripts/*.sh

      - name: Byte-compile Python Scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check Node.js Entry Points
        run: |
          node --check npm/bin/litespm.js
          node --check npm/scripts/install-binary.js

      # The installer is the only place this project executes a downloaded
      # native binary, so its refusal paths are tested rather than assumed.
      # test_npm.js needs a binary to resolve, so one is built first and dropped
      # in dist/ under the name the wrapper looks for.
      - name: Test npm Wrapper and Installer
        run: |
          go build -o "dist/$(node -p "require('./npm/bin/litespm.js').getBinaryName()")" ./cmd/litespm
          cd npm && npm test

  test-go:
    name: Test Go Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go Test Suite
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Go Test Suite (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

  build-web:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Type-check Web
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Build Web Static Export
        working-directory: ./web
        run: npm run build

      - name: Verify Static Output
        run: test -f web/out/index.html
